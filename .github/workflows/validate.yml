name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate package and links
        run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Copilot installation and skill resources
        run: |
          npm install --prefix .temp/copilot --no-audit --no-fund @github/copilot@1.0.83
          python3 scripts/test-copilot-install.py --copilot .temp/copilot/node_modules/.bin/copilot
      - name: Build collector and verify evidence boundaries
        run: |
          dotnet build skills/architecture-assessment/scripts/csharp-metrics.cs -o .temp/collector
          python3 scripts/test-analysis-tools.py --csharp-dll .temp/collector/csharp-metrics.dll
          python3 scripts/test-example.py --csharp-dll .temp/collector/csharp-metrics.dll
      - name: Verify browser proposal template
        run: |
          python3 -m venv .temp/browser-venv
          .temp/browser-venv/bin/pip install playwright==1.58.0
          .temp/browser-venv/bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          .temp/browser-venv/bin/python scripts/test-proposal-browser.py
